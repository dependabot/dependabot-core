[tool.poetry]
name = "local-version-before-index-version"
version = "0.1.0"
description = "Poetry project that locks a lower local version of a package before its PyPI version"
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
six = [
    { path = "vendor/six", python = "<3.10" },
    { version = "1.17.0", python = ">=3.10" },
]
