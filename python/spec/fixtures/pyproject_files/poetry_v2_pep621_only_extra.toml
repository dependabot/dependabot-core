[project]
name = "pep621-only-extra-project"
version = "0.1.0"
description = "A PEP 621 only project (Poetry v2) with a transitive dependency only required by an optional extra"
requires-python = ">=3.10,<4"
dependencies = [
    "urllib3>=1.26.0,<2.0",
]

[project.optional-dependencies]
security = [
    "requests>=2.28.0,<3.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
