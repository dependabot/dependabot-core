name: Latest images
env:
  BACKUP_REGISTRY: "dependabot-acr-apim-production.azure-api.net"
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths-ignore:
      - "common/lib/dependabot.rb"
permissions: {}

jobs:
  date-version:
    runs-on: ubuntu-latest
    if: github.repository == 'dependabot/dependabot-core'
    outputs:
      date: ${{ steps.date.outputs.DATE_BASED_VERSION }}
    steps:
      - id: date
        name: Set date based version
        # The v2 tag is the Updater image tag, not related to the core version.
        # This value has to be set here so all versions are the same.
        run: |
          DATE_BASED_VERSION="v2.0.$(date +%Y%m%d%H%M%S)"
          echo "DATE_BASED_VERSION=$DATE_BASED_VERSION" >> "$GITHUB_OUTPUT"

  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'dependabot/dependabot-core'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate ecosystem matrix
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          target: ecosystem

      - name: Remove internal targets
        id: matrix
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
        run: |
          MATRIX=$(jq -c '[.[] | select(.target != "updater-core")]' <<< "$BAKE_MATRIX")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  push-updater-image:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - date-version
      - prepare
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      COMMIT_SHA: ${{ github.sha }}
      DATE_VERSION: ${{ needs.date-version.outputs.date }}
      DEPENDABOT_UPDATER_VERSION: ""
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}
      VALIDATION_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}:validation-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ecosystem image for validation
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.output=type=docker
            ${{ matrix.target }}.tags=${{ env.VALIDATION_IMAGE }}

      - name: Validate ecosystem image
        env:
          IMAGE: ${{ env.VALIDATION_IMAGE }}
        run: |
          docker run --rm "$IMAGE" \
            bash -lc "cd /home/dependabot/dependabot-updater && bundle check"

          IMAGE_LAYERS=$(docker history -q "$IMAGE" | wc -l | sed -e 's/ //g')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

      - name: Build and push ecosystem image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.output=type=registry
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:${{ env.COMMIT_SHA }}
            ${{ matrix.target }}.tags+=${{ env.UPDATER_IMAGE }}:latest
            ${{ matrix.target }}.tags+=${{ env.UPDATER_IMAGE }}:${{ env.DATE_VERSION }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Pull images through backup registry
        run: |
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:$COMMIT_SHA"
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:latest"
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:$DATE_VERSION"

      - name: Set summary
        run: |
          {
            echo "updater uploaded with tag \`$COMMIT_SHA\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$COMMIT_SHA"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
