name: Latest images
env:
  BACKUP_REGISTRY: "dependabot-acr-apim-production.azure-api.net"
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths-ignore:
      - "common/lib/dependabot.rb"
  workflow_dispatch:
permissions: {}

concurrency:
  group: latest-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  date-version:
    runs-on: ubuntu-latest
    if: github.repository == 'dependabot/dependabot-core' && github.ref == 'refs/heads/main'
    outputs:
      date: ${{ steps.date.outputs.DATE_BASED_VERSION }}
    steps:
      - id: date
        name: Set date based version
        # The v2 tag is the Updater image tag, not related to the core version.
        # This value has to be set here so all versions are the same.
        run: |
          DATE_BASED_VERSION="v2.0.$(date +%Y%m%d%H%M%S)"
          echo "DATE_BASED_VERSION=$DATE_BASED_VERSION" >> "$GITHUB_OUTPUT"

  build-updater-core:
    runs-on: ubuntu-latest
    needs: prepare
    if: >-
      github.repository == 'dependabot/dependabot-core' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.build_count != '0'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      COMMIT_SHA: ${{ github.sha }}
      UPDATER_CORE_IMAGE: ghcr.io/dependabot/dependabot-updater-core
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push updater-core
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: updater-core-context
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=true
          set: |
            updater-core-context.output=type=registry
            updater-core-context.tags=${{ env.UPDATER_CORE_IMAGE }}:ecosystem-${{ env.COMMIT_SHA }}

      - name: Resolve updater-core digest
        id: digest
        env:
          CONTEXT_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['updater-core-context']['containerimage.digest'] }}
        run: echo "digest=$CONTEXT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate ecosystem updater-core attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_CORE_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: true

  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'dependabot/dependabot-core' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      build_count: ${{ steps.selection.outputs.build_count }}
      build_matrix: ${{ steps.selection.outputs.build_matrix }}
      promote_count: ${{ steps.selection.outputs.promote_count }}
      promote_matrix: ${{ steps.selection.outputs.promote_matrix }}
      source_tag: ${{ steps.source.outputs.source_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main tip
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_SHA" ]]

      - name: Generate ecosystem matrix
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          target: ecosystem

      - name: Verify predecessor image tags
        id: source
        if: github.event_name == 'push'
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
          SOURCE_TAG: ${{ github.event.before }}
        run: |
          AVAILABLE=true
          MISSING=()
          while read -r target; do
            image="ghcr.io/dependabot/dependabot-updater-${target}:${SOURCE_TAG}"
            if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              AVAILABLE=false
              MISSING+=("$target")
            fi
          done < <(
            jq -r '
              .[].target
              | select(
                  . != "python-runtime" and
                  . != "updater-core" and
                  (endswith("-raw") | not)
                )
            ' <<< "$BAKE_MATRIX"
          )

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$AVAILABLE" != "true" ]]; then
            printf 'Missing predecessor image tags: %s\n' "${MISSING[*]}"
          fi

      - name: Find affected ecosystems
        id: changes
        if: github.event_name == 'push'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: .github/image-filters.yml

      - name: Resolve image matrix
        id: selection
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
          CHANGED_TARGETS: ${{ steps.changes.outputs.changes || '[]' }}
          FORCE_ALL: >-
            ${{
              github.event_name != 'push' ||
              steps.changes.outcome != 'success' ||
              steps.source.outputs.available != 'true'
            }}
        run: |
          if ! RESULT=$(script/resolve-image-matrix); then
            echo "::warning::Image selection failed; building every ecosystem"
            RESULT=$(CHANGED_TARGETS='[]' FORCE_ALL=true script/resolve-image-matrix)
          fi
          echo "build_count=$(jq -r '.build_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$(jq -c '.build' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "promote_count=$(jq -r '.promote_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "promote_matrix=$(jq -c '.promote' <<< "$RESULT")" >> "$GITHUB_OUTPUT"

          {
            echo "## Image selection"
            echo
            echo "Build: $(jq -r '.build_count' <<< "$RESULT")"
            jq -r '.build[]? | "- `\(.target)`"' <<< "$RESULT"
            echo
            echo "Promote unchanged: $(jq -r '.promote_count' <<< "$RESULT")"
            jq -r '.promote[]? | "- `\(.target)`"' <<< "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  push-updater-image:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build-updater-core
      - date-version
      - prepare
    if: needs.prepare.outputs.build_count != '0'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    env:
      COMMIT_SHA: ${{ github.sha }}
      DATE_VERSION: ${{ needs.date-version.outputs.date }}
      DEPENDABOT_UPDATER_VERSION: ""
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push validated ecosystem image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: ${{ matrix.target }}
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=true
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            ${{ matrix.target }}.output=type=registry
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:${{ env.COMMIT_SHA }}

      - name: Validate and promote image manifest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
        run: |
          IMAGE="${UPDATER_IMAGE}@${IMAGE_DIGEST}"
          IMAGE_LAYERS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '.layers | length')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${UPDATER_IMAGE}:latest" \
            --tag "${UPDATER_IMAGE}:${DATE_VERSION}" \
            "$IMAGE"

          for tag in "$COMMIT_SHA" latest "$DATE_VERSION"; do
            TAG_DIGEST=$(docker buildx imagetools inspect "${UPDATER_IMAGE}:${tag}" --format '{{json .Manifest.Digest}}' | jq -r '.')
            [[ "$TAG_DIGEST" == "$IMAGE_DIGEST" ]]
          done

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Pull images through backup registry
        run: |
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:$COMMIT_SHA"
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:latest"
          docker pull "${BACKUP_REGISTRY}/${UPDATER_IMAGE}:$DATE_VERSION"

      - name: Set summary
        run: |
          {
            echo "updater uploaded with tag \`$COMMIT_SHA\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$COMMIT_SHA"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-unchanged-image:
    name: Promote unchanged
    runs-on: ubuntu-latest
    needs:
      - date-version
      - prepare
    if: needs.prepare.outputs.promote_count != '0'
    permissions:
      attestations: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.promote_matrix) }}
    env:
      BACKUP_REGISTRY: "dependabot-acr-apim-production.azure-api.net"
      COMMIT_SHA: ${{ github.sha }}
      DATE_VERSION: ${{ needs.date-version.outputs.date }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_PREFIX: ghcr.io/dependabot/dependabot-updater-
      SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote existing image digest
        run: |
          echo "## Promoted unchanged image" >> "$GITHUB_STEP_SUMMARY"
          TARGETS_JSON=$(jq -cn --arg target "$TARGET" '[{target: $target}]')
          TAGS_JSON=$(jq -cn --arg commit "$COMMIT_SHA" --arg date "$DATE_VERSION" '[$commit, $date]')
          export TARGETS_JSON TAGS_JSON
          script/promote-image-tags

      - name: Verify existing artifact attestation
        run: gh attestation verify "oci://${IMAGE_PREFIX}${TARGET}:${COMMIT_SHA}" --owner dependabot

      - name: Pull promoted tags through backup registry
        run: |
          docker pull "${BACKUP_REGISTRY}/${IMAGE_PREFIX}${TARGET}:$COMMIT_SHA"
          docker pull "${BACKUP_REGISTRY}/${IMAGE_PREFIX}${TARGET}:$DATE_VERSION"
