name: Branch images
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    types:
      - synchronize
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: number
        description: PR number
      force_all:
        description: Build every ecosystem image
        type: boolean
        default: false
permissions: {}

concurrency:
  group: branch-images-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  approval:
    # Skip when triggered by pull request events on PR's from forks because the GITHUB_TOKEN on
    # those PR's does not have write access, and thus cannot deploy to GHCR.
    # Running this workflow against PR's from forks requires manually triggering it via `workflow_dispatch`.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.decision.outputs.base_ref }}
      base_sha: ${{ steps.decision.outputs.base_sha }}
      decision: ${{ steps.decision.outputs.decision }}
      head_sha: ${{ steps.decision.outputs.head_sha }}
      pr: ${{ steps.decision.outputs.pr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set PR
        run: echo "PR=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
        if: github.event_name != 'workflow_dispatch'

      - name: Set PR when manually triggered (intended for forks)
        run: echo "PR=${{ inputs.pr }}" >> "$GITHUB_ENV"
        if: github.event_name == 'workflow_dispatch'

      # Skips push-updater-images by setting an output
      - name: Check if pull request is approved
        id: decision
        run: |
          # For security, the `gh` call that retrieves the PR approval status *must* also retrieve the commit at the
          # tip of the PR to ensure that any subsequent unreviewed commits are not pulled into this action workflow.
          PR_DATA=$(gh pr view "$PR" --json baseRefName,baseRefOid,commits,reviewDecision,state)
          HEAD_SHA=$(jq -r '.commits | last | .oid' <<< "$PR_DATA")
          DECISION=$(jq -r --arg head_sha "$HEAD_SHA" '"\(.reviewDecision):\(.state):\($head_sha)"' <<< "$PR_DATA")
          echo "base_ref=$(jq -r '.baseRefName' <<< "$PR_DATA")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.baseRefOid' <<< "$PR_DATA")" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

  prepare:
    runs-on: ubuntu-latest
    needs: approval
    if: startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN')
    permissions:
      attestations: read
      contents: read
      pull-requests: read
    outputs:
      build_docker_family: ${{ steps.selection.outputs.build_docker_family }}
      build_precommit: ${{ steps.selection.outputs.build_precommit }}
      build_python_family: ${{ steps.selection.outputs.build_python_family }}
      build_count: ${{ steps.selection.outputs.build_count }}
      generic_build_count: ${{ steps.selection.outputs.generic_build_count }}
      build_matrix: ${{ steps.selection.outputs.build_matrix }}
      python_build_count: ${{ steps.selection.outputs.python_build_count }}
      python_build_matrix: ${{ steps.selection.outputs.python_build_matrix }}
      promote_count: ${{ steps.selection.outputs.promote_count }}
      promote_matrix: ${{ steps.selection.outputs.promote_matrix }}
      source_tag: ${{ steps.base-source.outputs.source_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Preserve trusted image selection
        run: |
          cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"
          cp .github/image-filters.yml "$RUNNER_TEMP/image-filters.yml"
          cp script/resolve-image-matrix "$RUNNER_TEMP/resolve-image-matrix"

      - name: Generate ecosystem matrix
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: ${{ runner.temp }}/docker-bake.hcl
          target: ecosystem

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          BASE_REF: ${{ needs.approval.outputs.base_ref }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git fetch origin "$BASE_REF"

      - name: Resolve immutable base source
        id: base-source
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          BASE_REF: ${{ needs.approval.outputs.base_ref }}
        run: |
          SOURCE_TAG=$(git merge-base "$APPROVED_HEAD_SHA" "origin/$BASE_REF")
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify base image tags
        id: source
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
          SOURCE_TAG: ${{ steps.base-source.outputs.source_tag }}
        run: |
          AVAILABLE=true
          MISSING=()
          while read -r target; do
            image="ghcr.io/dependabot/dependabot-updater-${target}:${SOURCE_TAG}"
            if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              AVAILABLE=false
              MISSING+=("$target")
              continue
            fi
            if ! gh attestation verify "oci://${image}" --owner dependabot > /dev/null 2>&1; then
              AVAILABLE=false
              MISSING+=("$target (attestation)")
            fi
          done < <(
            jq -r '
              .[].target
              | select(
                  . != "python-runtime" and
                  . != "updater-core" and
                  (endswith("-raw") | not)
                )
            ' <<< "$BAKE_MATRIX"
          )

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          if [[ "$AVAILABLE" != "true" ]]; then
            printf 'Missing base image tags: %s\n' "${MISSING[*]}"
          fi

      - name: Find affected ecosystems
        id: changes
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ needs.approval.outputs.base_ref }}
          ref: ${{ needs.approval.outputs.head_sha }}
          filters: ${{ runner.temp }}/image-filters.yml

      - name: Resolve image matrix
        id: selection
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
          CHANGED_TARGETS: ${{ steps.changes.outputs.changes || '[]' }}
          FORCE_ALL: >-
            ${{
              inputs.force_all ||
              steps.changes.outcome != 'success' ||
              steps.source.outputs.available != 'true'
            }}
        run: |
          if ! RESULT=$("$RUNNER_TEMP/resolve-image-matrix"); then
            echo "::warning::Image selection failed; building every ecosystem"
            RESULT=$(CHANGED_TARGETS='[]' FORCE_ALL=true "$RUNNER_TEMP/resolve-image-matrix")
          fi
          echo "build_docker_family=$(jq -r '.build_docker_family' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "build_precommit=$(jq -r '.build_precommit' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "build_python_family=$(jq -r '.build_python_family' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "build_count=$(jq -r '.build_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "generic_build_count=$(jq -r '.generic_build_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$(jq -c '.generic_build' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "python_build_count=$(jq -r '.python_build_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "python_build_matrix=$(jq -c '.python_build' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "promote_count=$(jq -r '.promote_count' <<< "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "promote_matrix=$(jq -c '.promote' <<< "$RESULT")" >> "$GITHUB_OUTPUT"

          {
            echo "## Image selection"
            echo
            echo "Build: $(jq -r '.build_count' <<< "$RESULT")"
            jq -r '.build[]? | "- `\(.target)`"' <<< "$RESULT"
            echo
            echo "Promote unchanged: $(jq -r '.promote_count' <<< "$RESULT")"
            jq -r '.promote[]? | "- `\(.target)`"' <<< "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  build-updater-core:
    runs-on: ubuntu-latest
    needs:
      - approval
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.build_count != '0'
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      UPDATER_CORE_IMAGE: ghcr.io/dependabot/dependabot-updater-core
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push updater-core
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: updater-core-context
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            UPDATER_CORE_CONTEXT_VERSION=${{ env.DEPENDABOT_UPDATER_VERSION }}
          set: |
            updater-core-context.output=type=registry
            updater-core-context.tags=${{ env.UPDATER_CORE_IMAGE }}:${{ env.DEPENDABOT_UPDATER_VERSION }}

      - name: Resolve updater-core digest
        id: digest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['updater-core-context']['containerimage.digest'] }}
        run: echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_CORE_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: true

  push-updater-images:
    runs-on: ubuntu-latest
    needs:
      - approval
      - build-updater-core
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.generic_build_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      ECOSYSTEM: ${{ matrix.target }}
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git submodule update --init --recursive

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: metadata
        run: echo "version=$DEPENDABOT_UPDATER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push validated branch image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            ${{ matrix.target }}.output=type=registry
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:${{ steps.metadata.outputs.version }}

      - name: Validate image manifest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          IMAGE_TAG: ${{ steps.metadata.outputs.version }}
        run: |
          IMAGE="${UPDATER_IMAGE}@${IMAGE_DIGEST}"
          IMAGE_LAYERS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '.layers | length')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

          TAG_DIGEST=$(docker buildx imagetools inspect "${UPDATER_IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -r '.')
          [[ "$TAG_DIGEST" == "$IMAGE_DIGEST" ]]

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          {
            echo "updater uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for $ECOSYSTEM"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging $ECOSYSTEM $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for all ecosystems"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging * $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-python-runtime:
    runs-on: ubuntu-latest
    needs:
      - approval
      - build-updater-core
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.build_python_family == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      PYTHON_RUNTIME_IMAGE: ghcr.io/dependabot/dependabot-updater-python-runtime
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git fetch origin main
          git merge origin/main --ff-only
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Python runtime
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: python-runtime
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            python-runtime.output=type=registry
            python-runtime.tags=${{ env.PYTHON_RUNTIME_IMAGE }}:${{ env.DEPENDABOT_UPDATER_VERSION }}

      - name: Resolve Python runtime digest
        id: digest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['python-runtime']['containerimage.digest'] }}
        run: |
          TAG_DIGEST=$(docker buildx imagetools inspect "${PYTHON_RUNTIME_IMAGE}:${DEPENDABOT_UPDATER_VERSION}" --format '{{json .Manifest.Digest}}' | jq -r '.')
          [[ "$TAG_DIGEST" == "$IMAGE_DIGEST" ]]
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.PYTHON_RUNTIME_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: true

  push-python-images:
    runs-on: ubuntu-latest
    needs:
      - approval
      - build-python-runtime
      - build-updater-core
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.python_build_count != '0'
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.python_build_matrix) }}
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      ECOSYSTEM: ${{ matrix.target }}
      PYTHON_RUNTIME_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-python-runtime@${{ needs.build-python-runtime.outputs.digest }}
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git fetch origin main
          git merge origin/main --ff-only
          git submodule update --init --recursive

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push validated Python image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            PYTHON_RUNTIME_CONTEXT=${{ env.PYTHON_RUNTIME_CONTEXT }}
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            ${{ matrix.target }}.output=type=registry
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:${{ env.DEPENDABOT_UPDATER_VERSION }}

      - name: Validate image manifest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
        run: |
          IMAGE="${UPDATER_IMAGE}@${IMAGE_DIGEST}"
          IMAGE_LAYERS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '.layers | length')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

          TAG_DIGEST=$(docker buildx imagetools inspect "${UPDATER_IMAGE}:${DEPENDABOT_UPDATER_VERSION}" --format '{{json .Manifest.Digest}}' | jq -r '.')
          [[ "$TAG_DIGEST" == "$IMAGE_DIGEST" ]]

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          {
            echo "Python updater uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for $ECOSYSTEM"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging $ECOSYSTEM $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  push-docker-images:
    runs-on: ubuntu-latest
    needs:
      - approval
      - build-updater-core
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.build_docker_family == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
      attestations: write
      artifact-metadata: write
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      DOCKER_COMPOSE_IMAGE: ghcr.io/dependabot/dependabot-updater-docker-compose
      DOCKER_IMAGE: ghcr.io/dependabot/dependabot-updater-docker
      FAIL_ON_CONFLICT: true
      IMAGE_PREFIX: ghcr.io/dependabot/dependabot-updater-
      STAGING_TAG: ${{ format('{0}-docker-source', needs.approval.outputs.head_sha) }}
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Preserve build definition
        run: |
          cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"
          cp script/promote-image-tags "$RUNNER_TEMP/promote-image-tags"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git submodule update --init --recursive

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push validated Docker image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: docker
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            docker.output=type=registry
            docker.tags=${{ env.DOCKER_IMAGE }}:${{ env.STAGING_TAG }}

      - name: Validate and publish both image names
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['docker']['containerimage.digest'] }}
        run: |
          IMAGE="${DOCKER_IMAGE}@${IMAGE_DIGEST}"
          IMAGE_LAYERS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '.layers | length')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

          STAGING_DIGEST=$(docker buildx imagetools inspect "${DOCKER_IMAGE}:${STAGING_TAG}" --format '{{json .Manifest.Digest}}' | jq -r '.')
          [[ "$STAGING_DIGEST" == "$IMAGE_DIGEST" ]]

          for destination in "$DOCKER_IMAGE" "$DOCKER_COMPOSE_IMAGE"; do
            EXISTING_DIGEST=$(
              docker buildx imagetools inspect \
                "${destination}:${DEPENDABOT_UPDATER_VERSION}" \
                --format '{{json .Manifest.Digest}}' 2> /dev/null |
                jq -er 'select(type == "string" and startswith("sha256:"))' ||
                true
            )
            if [[ -n "$EXISTING_DIGEST" && "$EXISTING_DIGEST" != "$IMAGE_DIGEST" ]]; then
              echo "${destination}:${DEPENDABOT_UPDATER_VERSION} already resolves to conflicting digest $EXISTING_DIGEST"
              exit 1
            fi
          done

          TARGETS_JSON='[{"target":"docker"}]'
          TAGS_JSON=$(jq -cn --arg tag "$DEPENDABOT_UPDATER_VERSION" '[$tag]')
          SOURCE_TARGET=docker
          SOURCE_TAG="$STAGING_TAG"
          export TARGETS_JSON TAGS_JSON SOURCE_TARGET SOURCE_TAG
          "$RUNNER_TEMP/promote-image-tags"

          TARGETS_JSON='[{"target":"docker-compose"}]'
          export TARGETS_JSON
          "$RUNNER_TEMP/promote-image-tags"

      - name: Generate Docker artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DOCKER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)['docker']['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Generate Docker Compose artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DOCKER_COMPOSE_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)['docker']['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          {
            echo "Docker updater images uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`"
            echo "\`\`\`"
            echo "$DOCKER_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "$DOCKER_COMPOSE_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for both Docker ecosystems"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging docker $DEPENDABOT_UPDATER_VERSION"
            echo ".dependabot set-ecosystem-version staging docker-compose $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-unchanged-images:
    runs-on: ubuntu-latest
    needs:
      - approval
      - prepare
    if: >-
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.prepare.outputs.promote_count != '0'
    permissions:
      attestations: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.promote_matrix) }}
    env:
      APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
      FAIL_ON_CONFLICT: true
      IMAGE_PREFIX: ghcr.io/dependabot/dependabot-updater-
      SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote existing image digest
        run: |
          echo "## Promoted unchanged image" >> "$GITHUB_STEP_SUMMARY"
          TARGETS_JSON=$(jq -cn --arg target "$TARGET" '[{target: $target}]')
          TAGS_JSON=$(jq -cn --arg tag "$APPROVED_HEAD_SHA" '[$tag]')
          export TARGETS_JSON TAGS_JSON
          script/promote-image-tags

          {
            echo
            echo "deploy for $TARGET"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging $TARGET $APPROVED_HEAD_SHA"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing artifact attestation
        run: gh attestation verify "oci://${IMAGE_PREFIX}${TARGET}:${APPROVED_HEAD_SHA}" --owner dependabot

  push-precommit-image:
    runs-on: ubuntu-latest
    needs:
      - approval
      - build-updater-core
      - prepare
      - promote-unchanged-images
      - push-updater-images
    if: >-
      always() &&
      startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN') &&
      needs.build-updater-core.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.build_precommit == 'true' &&
      (needs.promote-unchanged-images.result == 'success' || needs.promote-unchanged-images.result == 'skipped') &&
      (needs.push-updater-images.result == 'success' || needs.push-updater-images.result == 'skipped')
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
      attestations: write
      artifact-metadata: write
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ needs.approval.outputs.head_sha }}
      UPDATER_CORE_CONTEXT: docker-image://ghcr.io/dependabot/dependabot-updater-core@${{ needs.build-updater-core.outputs.digest }}
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-pre-commit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.approval.outputs.base_sha }}

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout approved pull request
        env:
          APPROVED_HEAD_SHA: ${{ needs.approval.outputs.head_sha }}
          PR: ${{ needs.approval.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          [[ "$(git rev-parse HEAD)" == "$APPROVED_HEAD_SHA" ]]
          git submodule update --init --recursive

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push validated pre-commit image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: pre-commit
          provenance: false
          vars: |
            BUILD_CACHE_WRITE=false
            PRE_COMMIT_BUNDLER_CONTEXT=docker-image://ghcr.io/dependabot/dependabot-updater-bundler:${{ env.DEPENDABOT_UPDATER_VERSION }}
            PRE_COMMIT_GOMOD_CONTEXT=docker-image://ghcr.io/dependabot/dependabot-updater-gomod:${{ env.DEPENDABOT_UPDATER_VERSION }}
            PRE_COMMIT_PUB_CONTEXT=docker-image://ghcr.io/dependabot/dependabot-updater-pub:${{ env.DEPENDABOT_UPDATER_VERSION }}
            UPDATER_CORE_CONTEXT=${{ env.UPDATER_CORE_CONTEXT }}
          set: |
            pre-commit.output=type=registry
            pre-commit.tags=${{ env.UPDATER_IMAGE }}:${{ env.DEPENDABOT_UPDATER_VERSION }}

      - name: Validate image manifest
        env:
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['pre-commit']['containerimage.digest'] }}
        run: |
          IMAGE="${UPDATER_IMAGE}@${IMAGE_DIGEST}"
          IMAGE_LAYERS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '.layers | length')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

          TAG_DIGEST=$(docker buildx imagetools inspect "${UPDATER_IMAGE}:${DEPENDABOT_UPDATER_VERSION}" --format '{{json .Manifest.Digest}}' | jq -r '.')
          [[ "$TAG_DIGEST" == "$IMAGE_DIGEST" ]]

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)['pre-commit']['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          {
            echo "pre-commit updater uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for pre-commit"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging pre-commit $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
