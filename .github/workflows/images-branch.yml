name: Branch images
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    types:
      - synchronize
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: number
        description: PR number
permissions: {}

jobs:
  approval:
    # Skip when triggered by pull request events on PR's from forks because the GITHUB_TOKEN on
    # those PR's does not have write access, and thus cannot deploy to GHCR.
    # Running this workflow against PR's from forks requires manually triggering it via `workflow_dispatch`.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set PR
        run: echo "PR=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
        if: github.event_name != 'workflow_dispatch'

      - name: Set PR when manually triggered (intended for forks)
        run: echo "PR=${{ inputs.pr }}" >> "$GITHUB_ENV"
        if: github.event_name == 'workflow_dispatch'

      # Skips push-updater-images by setting an output
      - name: Check if pull request is approved
        id: decision
        run: |
          # For security, the `gh` call that retrieves the PR approval status *must* also retrieve the commit at the
          # tip of the PR to ensure that any subsequent unreviewed commits are not pulled into this action workflow.
          DECISION=$(gh pr view "$PR" --json reviewDecision,state,commits --jq '"\(.reviewDecision):\(.state):\(.commits | last .oid)"')
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

  prepare:
    runs-on: ubuntu-latest
    needs: approval
    if: startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN')
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate ecosystem matrix
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          target: ecosystem

      - name: Remove internal targets
        id: matrix
        env:
          BAKE_MATRIX: ${{ steps.bake-matrix.outputs.matrix }}
        run: |
          MATRIX=$(jq -c '[.[] | select(.target != "updater-core")]' <<< "$BAKE_MATRIX")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  push-updater-images:
    runs-on: ubuntu-latest
    needs:
      - approval
      - prepare
    if: startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ github.sha }}
      ECOSYSTEM: ${{ matrix.target }}
      UPDATER_IMAGE: ghcr.io/dependabot/dependabot-updater-${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Preserve build definition
        run: cp docker-bake.hcl "$RUNNER_TEMP/docker-bake.hcl"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare tag (forks)
        env:
          APPROVAL_DECISION: ${{ needs.approval.outputs.decision }}
        run: |
          gh pr checkout ${{ inputs.pr }}

          # Ensure the commit we've checked out matches our expected SHA from when we checked the PR's approval status above.
          # This is a security measure to prevent any unreviewed commits from getting pulled into this action workflow.
          # The format is "APPROVED:OPEN:<PR_COMMIT_SHA>", so compare the end of the string to the current commit.
          [[ "$APPROVAL_DECISION" =~ $(git rev-parse HEAD)$ ]]

          git fetch origin main
          git merge origin/main --ff-only
          git submodule update --init --recursive
          echo "DEPENDABOT_UPDATER_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        if: github.event_name == 'workflow_dispatch'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: metadata
        run: echo "version=$DEPENDABOT_UPDATER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ecosystem image for validation
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.output=type=docker
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:validation-${{ github.run_id }}

      - name: Validate ecosystem image
        env:
          IMAGE: ${{ env.UPDATER_IMAGE }}:validation-${{ github.run_id }}
        run: |
          docker run --rm "$IMAGE" \
            bash -lc "cd /home/dependabot/dependabot-updater && bundle check"

          IMAGE_LAYERS=$(docker history -q "$IMAGE" | wc -l | sed -e 's/ //g')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

      - name: Build and push branch image
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.output=type=registry
            ${{ matrix.target }}.tags=${{ env.UPDATER_IMAGE }}:${{ steps.metadata.outputs.version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          {
            echo "updater uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`"
            echo "\`\`\`"
            echo "$UPDATER_IMAGE:$DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for $ECOSYSTEM"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging $ECOSYSTEM $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
            echo "deploy for all ecosystems"
            echo "\`\`\`"
            echo ".dependabot set-ecosystem-version staging * $DEPENDABOT_UPDATER_VERSION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
