name: Branch images
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    types:
      - synchronize
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: number
        description: PR number
permissions: {}

jobs:
  approval:
    # Skip when triggered by pull request events on PR's from forks because the GITHUB_TOKEN on
    # those PR's does not have write access, and thus cannot deploy to GHCR.
    # Running this workflow against PR's from forks requires manually triggering it via `workflow_dispatch`.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set PR
        run: echo "PR=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
        if: github.event_name != 'workflow_dispatch'

      - name: Set PR when manually triggered (intended for forks)
        run: echo "PR=${{ inputs.pr }}" >> $GITHUB_ENV
        if: github.event_name == 'workflow_dispatch'

      # Skips push-updater-images by setting an output
      - name: Check if pull request is approved
        id: decision
        run: |
          # For security, the `gh` call that retrieves the PR approval status *must* also retrieve the commit at the
          # tip of the PR to ensure that any subsequent unreviewed commits are not pulled into this action workflow.
          DECISION=$(gh pr view ${{ env.PR }} --json reviewDecision,state,commits --jq '"\(.reviewDecision):\(.state):\(.commits | last .oid)"')
          echo "decision=$DECISION" >> $GITHUB_OUTPUT

  push-updater-images:
    runs-on: ubuntu-latest
    needs: approval
    if: startsWith(needs.approval.outputs.decision, 'APPROVED:OPEN')
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: bazel, ecosystem: bazel }
          - { name: bun, ecosystem: bun }
          - { name: bundler, ecosystem: bundler }
          - { name: cargo, ecosystem: cargo }
          - { name: conda, ecosystem: conda }
          - { name: composer, ecosystem: composer }
          - { name: deno, ecosystem: deno }
          - { name: devcontainers, ecosystem: devcontainers }
          - { name: docker_compose, ecosystem: docker-compose }
          - { name: docker, ecosystem: docker }
          - { name: dotnet_sdk, ecosystem: dotnet-sdk }
          - { name: elm, ecosystem: elm }
          - { name: git_submodules, ecosystem: gitsubmodule }
          - { name: github_actions, ecosystem: github-actions }
          - { name: go_modules, ecosystem: gomod }
          - { name: gradle, ecosystem: gradle }
          - { name: helm, ecosystem: helm }
          - { name: hex, ecosystem: mix }
          - { name: julia, ecosystem: julia }
          - { name: maven, ecosystem: maven }
          - { name: nix, ecosystem: nix }
          - { name: npm_and_yarn, ecosystem: npm }
          - { name: nuget, ecosystem: nuget }
          - { name: pre_commit, ecosystem: pre-commit }
          - { name: pub, ecosystem: pub }
          - { name: python, ecosystem: pip }
          - { name: rust_toolchain, ecosystem: rust-toolchain }
          - { name: sbt, ecosystem: sbt }
          - { name: swift, ecosystem: swift }
          - { name: terraform, ecosystem: terraform }
          - { name: opentofu, ecosystem: opentofu }
          - { name: uv, ecosystem: uv }
          - { name: vcpkg, ecosystem: vcpkg }
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    env:
      DEPENDABOT_UPDATER_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare tag
        run: echo "DEPENDABOT_UPDATER_VERSION=${{ github.sha }}" >> $GITHUB_ENV
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'

      - name: Prepare tag (forks)
        run: |
          gh pr checkout ${{ inputs.pr }}

          # Ensure the commit we've checked out matches our expected SHA from when we checked the PR's approval status above.
          # This is a security measure to prevent any unreviewed commits from getting pulled into this action workflow.
          # The format is "APPROVED:OPEN:<PR_COMMIT_SHA>", so compare the end of the string to the current commit.
          [[ ${{needs.approval.outputs.decision}} =~ $(git rev-parse HEAD)$ ]]

          git fetch origin main
          git merge origin/main --ff-only || exit 1
          git submodule update --init --recursive
          echo "DEPENDABOT_UPDATER_VERSION=$(git rev-parse HEAD)" >> $GITHUB_ENV
        if: github.event_name == 'workflow_dispatch'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        env:
          ECOSYSTEM: ${{ matrix.suite.ecosystem }}
          NAME: ${{ matrix.suite.name }}
        run: |
          DOCKERFILE="$NAME/Dockerfile"
          if [[ "$NAME" == "docker_compose" ]]; then
            DOCKERFILE="docker/Dockerfile"
          fi

          IMAGE="ghcr.io/dependabot/dependabot-updater-$ECOSYSTEM"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$DEPENDABOT_UPDATER_VERSION" >> "$GITHUB_OUTPUT"
          echo "reference=$IMAGE:$DEPENDABOT_UPDATER_VERSION" >> "$GITHUB_OUTPUT"
          echo "validation-reference=$IMAGE:validation-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          {
            echo "build-contexts<<EOF"
            echo "ghcr.io/dependabot/dependabot-updater-core=oci-layout://$RUNNER_TEMP/updater-core"
            if [[ "$NAME" == "pre_commit" ]]; then
              echo "ghcr.io/dependabot/dependabot-updater-gomod:latest=oci-layout://$RUNNER_TEMP/go-modules"
              echo "ghcr.io/dependabot/dependabot-updater-bundler:latest=oci-layout://$RUNNER_TEMP/bundler"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build updater-core image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.updater-core
          outputs: type=oci,dest=${{ runner.temp }}/updater-core,tar=false
          provenance: false
          build-args: |
            USER_UID=1000
            USER_GID=1000
            DEPENDABOT_UPDATER_VERSION=${{ steps.image.outputs.version }}
          cache-from: |
            type=gha,scope=updater-core
            type=registry,ref=ghcr.io/dependabot/dependabot-updater-core:latest
          cache-to: type=gha,mode=max,scope=updater-core

      # script/build previously built these recursively for pre_commit. Keep using the reviewed
      # commit instead of pulling the published gomod and bundler images.
      - name: Build pre-commit go_modules image
        if: matrix.suite.name == 'pre_commit'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: go_modules/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/go-modules,tar=false
          provenance: false
          build-contexts: |
            ghcr.io/dependabot/dependabot-updater-core=oci-layout://${{ runner.temp }}/updater-core
          cache-from: |
            type=gha,scope=go_modules
            type=registry,ref=ghcr.io/dependabot/dependabot-updater-gomod:latest
          cache-to: type=gha,mode=max,scope=go_modules

      - name: Build pre-commit bundler image
        if: matrix.suite.name == 'pre_commit'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: bundler/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/bundler,tar=false
          provenance: false
          build-contexts: |
            ghcr.io/dependabot/dependabot-updater-core=oci-layout://${{ runner.temp }}/updater-core
          cache-from: |
            type=gha,scope=bundler
            type=registry,ref=ghcr.io/dependabot/dependabot-updater-bundler:latest
          cache-to: type=gha,mode=max,scope=bundler

      - name: Build ecosystem image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          load: true
          tags: ${{ steps.image.outputs.validation-reference }}
          provenance: false
          build-contexts: ${{ steps.image.outputs.build-contexts }}
          cache-from: |
            type=gha,scope=${{ matrix.suite.name }}
            type=registry,ref=${{ steps.image.outputs.name }}:latest
          cache-to: type=gha,mode=max,scope=${{ matrix.suite.name }}

      - name: Validate ecosystem image
        env:
          IMAGE: ${{ steps.image.outputs.validation-reference }}
        run: |
          docker run --rm "$IMAGE" \
            bash -lc "cd /home/dependabot/dependabot-updater && bundle check"

          IMAGE_LAYERS=$(docker history -q "$IMAGE" | wc -l | sed -e 's/ //g')
          echo "$IMAGE contains $IMAGE_LAYERS layers"
          [[ $IMAGE_LAYERS -lt 126 ]]

      - name: Build and push branch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.reference }}
          provenance: false
          build-contexts: ${{ steps.image.outputs.build-contexts }}
          cache-from: |
            type=gha,scope=${{ matrix.suite.name }}
            type=registry,ref=${{ steps.image.outputs.name }}:latest
          cache-to: type=gha,mode=max,scope=${{ matrix.suite.name }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: true

      - name: Set summary
        run: |
          echo "updater uploaded with tag \`$DEPENDABOT_UPDATER_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/dependabot/dependabot-updater-${{ matrix.suite.ecosystem }}:$DEPENDABOT_UPDATER_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "deploy for ${{ matrix.suite.ecosystem }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo ".dependabot set-ecosystem-version staging ${{ matrix.suite.ecosystem }} $DEPENDABOT_UPDATER_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "deploy for all ecosystems" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo ".dependabot set-ecosystem-version staging * $DEPENDABOT_UPDATER_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
