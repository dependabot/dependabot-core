name: Sorbet
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sorbet:
    name: Sorbet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - run: bundle exec tapioca gem --verify

      - run: bundle exec srb tc

      - name: Check Bundler v2 helper specs
        working-directory: bundler/helpers/v2
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          bundle exec srb tc
          # Spoom resets Bundler's environment before launching the compiler.
          sorbet="$(bundle exec ruby -e '
            puts File.join(Gem.loaded_specs.fetch("sorbet-static").full_gem_path, "libexec", "sorbet")
          ')"
          bundle exec spoom srb coverage --sorbet="$sorbet"
          bundle exec spoom srb bump --from=false --to=true --dry --sorbet="$sorbet"
          bundle exec spoom srb bump --from=true --to=strict --dry --sorbet="$sorbet"
          bundle exec spoom srb bump --from=strict --to=strong --dry --sorbet="$sorbet"

      - run: bundle exec spoom srb coverage

      - name: Check Bundler v4 helper specs
        working-directory: bundler/helpers/v4
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          bundle exec srb tc
          # Spoom resets Bundler's environment before launching the compiler.
          sorbet="$(bundle exec ruby -e '
            puts File.join(Gem.loaded_specs.fetch("sorbet-static").full_gem_path, "libexec", "sorbet")
          ')"
          bundle exec spoom srb coverage --sorbet="$sorbet"
          bundle exec spoom srb bump --from=false --to=true --dry --sorbet="$sorbet"
          bundle exec spoom srb bump --from=true --to=strict --dry --sorbet="$sorbet"
          bundle exec spoom srb bump --from=strict --to=strong --dry --sorbet="$sorbet"

      - run: |
          bundle exec spoom srb bump --from=false --to=true --dry
          bundle exec spoom srb bump --from=true --to=strict --dry
          bundle exec spoom srb bump --from=strict --to=strong --dry

      - run: bundle exec spoom srb coverage snapshot --save

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spoom_data
          path: ./spoom_data/

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./script/generate-coverage-report
        env:
          GH_TOKEN: ${{ github.token }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spoom_report
          path: ./spoom_report.html
